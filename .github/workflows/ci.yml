name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Published btt version to smoke-test, at least 14 days old
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n scripts/install.sh scripts/check.sh
      - name: Test installer and checks
        run: python3 -m unittest discover -s tests -v
  smoke:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./
        id: install
        with:
          version: ${{ inputs.version }}
          install-only: 'true'
      - name: Prepare a Rust project
        shell: bash
        run: |
          mkdir -p smoke
          printf 'Example\n└── it works\n' > smoke/example.tree
          printf '[project]\npacks = ["rust"]\n' > smoke/btt.toml
          btt scaffold --pack rust smoke/example.tree
      - uses: ./
        with:
          version: ${{ inputs.version }}
          working-directory: smoke
          test-command: btt --version
      - name: Verify drift fails
        shell: bash
        run: |
          printf 'Example\n└── it is missing\n' > smoke/example.tree
          if btt check smoke; then
            echo 'Expected btt to reject a missing test' >&2
            exit 1
          fi
